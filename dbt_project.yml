
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'ContosoRetailDW'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'default'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# 5. Tracking (ZERO spaces at the start of the next line!)
# 5. Tracking (Updated to include Elementary Audit Upload)
on-run-end:
  - "{{ log_run_results(results) }}" #Added project name prefix
  #- "{{ elementary.upload_results() }}" # <--- This records your test status/time/severity

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In dbt, the default materialization for a model is a view. This means, when you run 
# dbt run or dbt build, all of your models will be built as a view in your data platform. 
# The configuration below will override this setting for models in the example folder to 
# instead be materialized as tables. Any models you add to the root of the models folder will 
# continue to be built as views. These settings can be overridden in the individual model files
# using the `{{ config(...) }}` macro.

# Configuring models
models:
  # --- 1. ELEMENTARY CONFIGURATION ---
  # This tells dbt to put audit tables in a specific 'elementary' schema in BigQuery
  elementary:
    +schema: elementary

  # --- 2. YOUR PROJECT CONFIGURATION ---
  ContosoRetailDW:
    # Staging: Preparing hashes and business keys
    staging:
      +schema: staging
      +materialized: incremental
      +incremental_strategy: insert_overwrite
      +partition_by:
          field: source_load_date 
          data_type: datetime
          granularity: day
    
    vault_staging:
      +schema: vault_stage
      +materialized: view  # <--- This prevents the _PARTITIONTIME error!

    # Raw Vault: Hubs, Links, and Satellites
    raw_vault:
      +schema: raw_vault
      +materialized: incremental

    # Business Vault: PITs, Bridges, and calculated Satellites
    business_vault:
      +schema: business_vault
      +materialized: view

    # Mart: The Star Schema (Dim and Fact) for the users
    mart:
      +schema: mart
      +materialized: table