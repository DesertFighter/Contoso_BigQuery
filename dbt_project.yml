name: 'ContosoRetailDW'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# --- 1. GLOBAL VARIABLES ---
# This section solves your Elementary crash.
vars:
  elementary_enabled: true
  edr_collect_artifacts: false  # ✅ KEEPS test audits, STOPS the metadata crash.
  # This FORCES the audit trail (tests) to stay active
  edr_collect_test_results: true 
  edr_collect_run_results: true

# --- 2. HOOKS ---
on-run-end:
  - "{{ log_run_results(results) }}"
  # We leave Elementary's internal hooks to run automatically based on the vars above.

# --- 3. MODEL CONFIGURATIONS ---
models:
  # Elementary internal tables
  elementary:
    +schema: elementary

  ContosoRetailDW:
    # Staging: Preparing hashes and business keys
    staging:
      +schema: staging
      +materialized: incremental
      +incremental_strategy: insert_overwrite
      +partition_by:
          field: source_load_date 
          data_type: datetime
          granularity: day

    # Raw Vault: Hubs, Links, and Satellites
    raw_vault:
      +schema: raw_vault
      +materialized: incremental

    # Business Vault: PITs, Bridges, and calculated Satellites
    business_vault:
      +schema: business_vault
      +materialized: view

    # Mart: The Star Schema (Dim and Fact) for the users
    mart:
      +schema: mart
      +materialized: table