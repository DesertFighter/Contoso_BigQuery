  # ==========================================
  # TRANSACTION STAGING (LINK ENTITIES)
  # ==========================================

  - name: stg_contoso__fact_exchange_rate
    description: "Table 18 - Staging model for Exchange Rate facts. Grain: Currency + Date."
    columns:
      - name: exchange_rate_hk
        description: "Link Hash Key representing the daily exchange rate record."
        tests:
          - not_null: {config: {severity: error}}
          - unique: {config: {severity: error}}
      - name: currency_hk
        description: "Referential Integrity link to Currency Hub."
        tests:
          - not_null: {config: {severity: error}}
          - relationships:
              arguments:
                to: ref('stg_contoso__dim_currency')
                field: currency_hk
              config: {severity: warn}
      - name: date_hk
        description: "Referential Integrity link to Date Hub."
        tests:
          - not_null: {config: {severity: error}}
          - relationships:
              arguments:
                to: ref('stg_contoso__dim_date')
                field: date_hk
              config: {severity: warn}
      - name: AverageRate
        description: "Fact Measure: Average exchange rate for the day."
        tests:
          - not_null: {config: {severity: warn}}

  - name: stg_contoso__fact_inventory
