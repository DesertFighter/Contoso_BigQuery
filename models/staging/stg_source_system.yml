  - name: stg_contoso__dim_account
    description: "Table 1 - Staging model for Account master data with DV 2.0 hashing."
    columns:
      - name: AccountLabel
        description: "The unique natural business key for the account."
        tests:
          - not_null: {config: {severity: error}}
          - unique: {config: {severity: error}}
      - name: account_hk
        description: "Primary Hash Key for the Account Hub."
        tests:
          - not_null: {config: {severity: error}}
          - unique: {config: {severity: error}}
      - name: account_hashdiff
        description: "Hash used to detect descriptive changes in the Account Satellite."
        tests:
          - not_null: {config: {severity: warn}}
      - name: load_datetime
        description: "Timestamp representing when the record entered the ecosystem."
        tests:
          - not_null: {config: {severity: warn}}

